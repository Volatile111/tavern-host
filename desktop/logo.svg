<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Tavern Host: a tankard with a server rack inside (four drive bays) under the foam.
       The lights have ids (bay1p/bay1a ... bay4p/bay4a: power + activity) so the desktop app can show live server
       status in the taskbar icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a4516"/>
      <stop offset="1" stop-color="#3a1807"/>
    </linearGradient>
    <linearGradient id="ale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a230b"/>
      <stop offset="1" stop-color="#321605"/>
    </linearGradient>
    <g id="drive">
      <rect x="71" y="0" width="90" height="20" rx="4" fill="url(#bay)" stroke="#7a3d14" stroke-width="1.5"/>
      <g fill="#8a4a1c">
        <rect x="105" y="4" width="3" height="12" rx="1.5"/>
        <rect x="110" y="4" width="3" height="12" rx="1.5"/>
        <rect x="115" y="4" width="3" height="12" rx="1.5"/>
        <rect x="120" y="4" width="3" height="12" rx="1.5"/>
        <rect x="125" y="4" width="3" height="12" rx="1.5"/>
        <rect x="130" y="4" width="3" height="12" rx="1.5"/>
      </g>
      <rect x="141" y="5" width="15" height="10" rx="3" fill="none" stroke="#e9a34a" stroke-width="2.5"/>
    </g>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- handle -->
  <path d="M168 104 h14 a26 26 0 0 1 26 26 v24 a26 26 0 0 1 -26 26 h-14" fill="none" stroke="#f0a73a" stroke-width="18" stroke-linecap="round"/>
  <!-- mug body -->
  <rect x="56" y="88" width="120" height="124" rx="16" fill="url(#ale)"/>
  <!-- rack chassis and four drive bays -->
  <rect x="66" y="104" width="100" height="100" rx="9" fill="#2a1204"/>
  <use href="#drive" y="109"/>
  <use href="#drive" y="133"/>
  <use href="#drive" y="157"/>
  <use href="#drive" y="181"/>
  <!-- status lights: power (left) and activity (right) per bay -->
  <circle id="bay1p" cx="80" cy="119" r="5.2" fill="#4ade80"/>
  <circle id="bay1a" cx="94" cy="119" r="5.2" fill="#60a5fa"/>
  <circle id="bay2p" cx="80" cy="143" r="5.2" fill="#4ade80"/>
  <circle id="bay2a" cx="94" cy="143" r="5.2" fill="#60a5fa"/>
  <circle id="bay3p" cx="80" cy="167" r="5.2" fill="#4ade80"/>
  <circle id="bay3a" cx="94" cy="167" r="5.2" fill="#60a5fa"/>
  <circle id="bay4p" cx="80" cy="191" r="5.2" fill="#fbbf24"/>
  <circle id="bay4a" cx="94" cy="191" r="5.2" fill="#4ade80"/>
  <!-- foam head -->
  <path d="M52 96 c-4 -18 12 -30 26 -26 c4 -14 24 -20 36 -10 c10 -12 32 -8 36 8 c16 -4 30 10 26 28 z" fill="#fff4dc"/>
</svg>
